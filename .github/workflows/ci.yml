name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: ./scripts/ci-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format and clippy
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-run
      # ONNX Runtime (static) loads DirectML.dll at start on Windows; put it beside the test binaries.
      - if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/directml.sh target/debug/deps
      - run: cargo test --locked
